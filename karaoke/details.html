<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .song-title {
            margin-top: 5px;
            text-align: center;
        }
        .lyrics {
            margin-top: 10px;

        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="song-title">
            <h1 id="song-title">Loading...</h1>
            <p id="song-artist"></p>
        </div>
        <div class="lyrics">
            <h3>Lyrics:</h3>
            <p id="lyrics-text">Loading...</p>
        </div>
        <a href="index.html" class="btn btn-primary mt-4">Back to Song List</a>
    </div>

    <script>
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const lyricsText = document.getElementById('lyrics-text');

        // Get song ID from the URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id');

        // Fetch song data from the external JSON file
        fetch('data/songs.json')
            .then(response => response.json())
            .then(songs => {
                const song = songs[songId];

                if (song) {
                    songTitle.textContent = song.name;
                    songArtist.textContent = `${song.artist} (${song.year})`;
                    lyricsText.textContent = song.lyrics;
                } else {
                    songTitle.textContent = 'Song not found';
                    songArtist.textContent = '';
                    lyricsText.textContent = 'No lyrics available';
                }
            })
            .catch(error => console.error('Error loading song data:', error));
    </script>
</body>
</html>
