<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The magic line: 0 means zero seconds delay, followed by the destination URL -->
    <meta http-meta http-equiv="refresh" content="0; url=https://www.instagram.com/anton.on.stage/">
    <title>Redirecting to Instagram...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fafafa;
            color: #262626;
        }
        .container {
            text-align: center;
        }
        a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Redirecting you to Instagram...</p>
        <p>If you aren't redirected automatically, <a href="https://www.instagram.com/anton.on.stage/">click here</a>.</p>
    </div>
</body>
</html>
